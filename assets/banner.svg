<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      fill: #f8fafc;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }

    /* Subtle dynamic floating and pulse animations in background/cards */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.08); }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    @keyframes floatCard3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -40; }
    }
    @keyframes rotateSync {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .pulse-bg-1 {
      animation: pulseGlow 8s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .pulse-bg-2 {
      animation: pulseGlow 10s ease-in-out infinite alternate;
      transform-origin: 1000px 250px;
    }
    .stream-line {
      stroke-dasharray: 8, 8;
      animation: dashStream 2s linear infinite;
    }
    .card-anim-1 { animation: floatCard1 5s ease-in-out infinite; }
    .card-anim-2 { animation: floatCard2 6s ease-in-out infinite; }
    .card-anim-3 { animation: floatCard3 5.5s ease-in-out infinite; }
    .rotating-icon {
      animation: rotateSync 14s linear infinite;
      transform-origin: center;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Animated Glowing Background Orbs (Behind everything) -->
  <circle class="pulse-bg-1" cx="200" cy="80" r="140" fill="#3b82f6" opacity="0.25" filter="url(#glow)" />
  <circle class="pulse-bg-2" cx="1020" cy="240" r="160" fill="#8b5cf6" opacity="0.2" filter="url(#glow)" />
  <circle cx="600" cy="30" r="100" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />

  <!-- Background Data Stream Grid Lines -->
  <g opacity="0.15">
    <path d="M 0 90 L 1200 90" stroke="#38bdf8" stroke-width="1" />
    <path d="M 0 180 L 1200 180" stroke="#818cf8" stroke-width="1" />
    <path d="M 0 270 L 1200 270" stroke="#38bdf8" stroke-width="1" />
    <path d="M 300 0 L 300 360" stroke="#38bdf8" stroke-width="1" />
    <path d="M 600 0 L 600 360" stroke="#818cf8" stroke-width="1" />
    <path d="M 900 0 L 900 360" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Connecting Stream Lines (Dynamic Flow) -->
  <path class="stream-line" d="M 120 290 Q 300 320 480 290 T 840 290 T 1120 290" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.4" />

  <!-- Upper Tag / Pill -->
  <g transform="translate(60, 42)">
    <rect width="365" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.9" />
    <circle cx="16" cy="15" r="5" fill="#10b981" />
    <text x="32" y="20" class="badge-text" fill="#38bdf8">⚡ CURATED SAAS &amp; OPEN-SOURCE DIRECTORY</text>
  </g>

  <!-- Main Title (Strictly Foreground & Crisp) -->
  <text x="60" y="125" class="title-text" font-size="40">Awesome SaaS Application Backup</text>
  <text x="60" y="165" class="title-text" font-size="28" fill="#38bdf8" opacity="0.95">Microsoft 365 • Salesforce • Google Workspace</text>

  <!-- Subtitle / Tagline -->
  <text x="60" y="202" class="subtitle-text" font-size="16">
    Comprehensive guide to cloud-to-cloud cyber resilience, immutable retention, ransomware recovery &amp; eDiscovery.
  </text>

  <!-- Dynamic Foreground Feature Cards (Positioned lower, safely away from titles) -->
  <g class="card-anim-1" transform="translate(60, 240)">
    <rect width="210" height="74" rx="12" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.2" />
    <rect x="14" y="16" width="42" height="42" rx="8" fill="#1e3a8a" opacity="0.6" />
    <text x="24" y="44" font-size="22">🏢</text>
    <text x="68" y="38" class="badge-text" fill="#f8fafc" font-size="14">Microsoft 365</text>
    <text x="68" y="55" class="subtitle-text" font-size="12">Exchange, OneDrive, Teams</text>
  </g>

  <g class="card-anim-2" transform="translate(290, 240)">
    <rect width="210" height="74" rx="12" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.2" />
    <rect x="14" y="16" width="42" height="42" rx="8" fill="#083344" opacity="0.6" />
    <text x="24" y="44" font-size="22">☁️</text>
    <text x="68" y="38" class="badge-text" fill="#f8fafc" font-size="14">Salesforce SFDC</text>
    <text x="68" y="55" class="subtitle-text" font-size="12">Objects, Metadata, Files</text>
  </g>

  <g class="card-anim-3" transform="translate(520, 240)">
    <rect width="210" height="74" rx="12" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.2" />
    <rect x="14" y="16" width="42" height="42" rx="8" fill="#3b0764" opacity="0.6" />
    <text x="24" y="44" font-size="22">📂</text>
    <text x="68" y="38" class="badge-text" fill="#f8fafc" font-size="14">Google Workspace</text>
    <text x="68" y="55" class="subtitle-text" font-size="12">Gmail, Drive, Shared Drives</text>
  </g>

  <g class="card-anim-1" transform="translate(750, 240)">
    <rect width="200" height="74" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" />
    <rect x="14" y="16" width="42" height="42" rx="8" fill="#064e3b" opacity="0.6" />
    <text x="24" y="44" font-size="22">🛡️</text>
    <text x="68" y="38" class="badge-text" fill="#f8fafc" font-size="14">Zero-Trust / Air-Gap</text>
    <text x="68" y="55" class="subtitle-text" font-size="12">Immutable Ransomware Shield</text>
  </g>

  <g class="card-anim-2" transform="translate(970, 240)">
    <rect width="170" height="74" rx="12" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.2" />
    <rect x="14" y="16" width="42" height="42" rx="8" fill="#500724" opacity="0.6" />
    <text x="24" y="44" font-size="22">💻</text>
    <text x="68" y="38" class="badge-text" fill="#f8fafc" font-size="14">Open-Source</text>
    <text x="68" y="55" class="subtitle-text" font-size="12">Self-Hosted Backups</text>
  </g>
</svg>
